name: CI - Optimized Pipeline
on: [push]

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

  quality:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        task: [lint, type-check, security]
    steps:
      - run: echo "Running ${{ matrix.task }}"

  test:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        node: [14,16,18]
        suite: [unit, integration]
    steps:
      - run: echo "Testing Node ${{ matrix.node }} - ${{ matrix.suite }}"

  build:
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - run: echo "cached build"

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo "docker with cache"

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - run: echo "fast deploy"
