name: CI - Messy Pipeline
on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: npm install
      - run: echo "linting"

  test-unit:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v2
      - run: npm install
      - run: echo "unit tests"

  test-integration:
    runs-on: ubuntu-latest
    needs: test-unit
    steps:
      - uses: actions/checkout@v2
      - run: npm install
      - run: echo "integration tests"

  build:
    runs-on: ubuntu-latest
    needs: test-integration
    steps:
      - uses: actions/checkout@v2
      - run: npm install
      - run: echo "build app"

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v2
      - run: echo "docker build"

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - run: echo "deploying..."
